# Dependabot: monthly, grouped, to keep the noise down. The pins Dependabot can't see (upstream
# release tags and asset SHA-256s) are bumped by bump-pins.yml instead.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      # Avalonia and the libraries built on it move together.
      avalonia:
        patterns: ["*Avalonia*"]
      nuget:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Avalonia.Headless.XUnit is built against xunit 3.x; its [AvaloniaFact] tests fail at
      # discovery on xunit.v3 4. Lift this once Avalonia ships a headless package for xunit 4.
      - dependency-name: "xunit.v3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "xunit.runner.visualstudio"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

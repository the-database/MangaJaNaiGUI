name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (used as the git tag and the package version)'
        required: true
      linux_only:
        description: 'Build only the Linux artifacts (skip the Windows leg)'
        default: 'false'
      windows_only:
        description: 'Build only the Windows artifacts (skip the Linux leg)'
        default: 'false'

# Builds the Inno-installer distribution and publishes a draft GitHub release:
#   - MangaJaNaiGUI-Setup-<ver>.exe                       per-user setup installer (wraps the slim core)
#   - MangaJaNaiGUI-full-package-<ver>.zip                the slim core (what MangaJaNaiUpdater downloads)
#   - manifest.json                                       the package's version, deps and file list
#   - component-*.7z + packs.json                         on-demand component packs: the TensorRT runtime,
#                                                         per-GPU builder resources, the ONNX models, and
#                                                         the opt-in TensorRT-RTX backend
# The deploy-linux leg adds the RID-suffixed Linux assets to the same release:
#   - MangaJaNaiGUI-v<ver>-linux-x64.tar.gz               the slim core with install.sh (the download, and
#                                                         MangaJaNaiUpdater's full update on Linux)
#   - MangaJaNaiGUI-x86_64-v<ver>.AppImage                the core with the TensorRT runtime and models baked
#                                                         in; the GPU's builder kernels download on first launch
#   - manifest-linux-x64.json
#   - component-*-linux-x64.7z + packs-linux-x64.json     the Linux component packs (no TensorRT-RTX, no DirectML)
# Both legs upload hundreds of MB with one token and can trip GitHub's upload rate limit; dispatch
# windows_only=true, wait, then linux_only=true to release them one after the other.
# MangaJaNaiUpdater only sees published releases (releases/latest skips drafts), so installed apps
# update once the draft is published.
jobs:
  deploy:
    if: ${{ github.event.inputs.linux_only != 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'  # Must match <TargetFramework> across the projects

      # The package builder runs on the CI runner, so framework-dependent is fine.
      - name: Publish package builder
        run: dotnet publish BuildMangaJaNai/BuildMangaJaNai.csproj -c Release -o builder

      # Self-contained: it forms the install root and must run without a separately installed runtime.
      - name: Publish app
        run: dotnet publish MangaJaNaiConverterGui/MangaJaNaiConverterGui.csproj -c Release -r win-x64 --self-contained -o app-publish

      # Single-file self-contained updater (set in its csproj).
      - name: Publish updater
        run: dotnet publish MangaJaNaiUpdater/MangaJaNaiUpdater.csproj -c Release -o updater-publish

      # Assemble the core (aji, the upscaling backend, ONNX Runtime/DirectML, the VC++ runtime, plus the
      # TensorRT runtime, TensorRT-RTX and models), carve the TensorRT runtime, builder resources,
      # TensorRT-RTX and models into component packs, then write the slim core's manifest and
      # full-package zip.
      - name: Assemble package
        run: ./builder/BuildMangaJaNai.exe ${{ github.event.inputs.version }} --app-dir app-publish --updater updater-publish/MangaJaNaiUpdater.exe --packs --out publish

      - name: Build setup installer
        shell: pwsh
        run: |
          choco install innosetup -y
          $ver = "${{ github.event.inputs.version }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$ver" `
            "/DSourceDir=$(Resolve-Path "publish/MangaJaNaiConverterGui-v$ver")" `
            "/O$(Get-Location)" `
            installer/mangajanaiconvertergui.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage manifest
        shell: pwsh
        run: Copy-Item "publish/MangaJaNaiConverterGui-v${{ github.event.inputs.version }}/manifest.json" manifest.json

      # allowUpdates + updateOnlyUnreleased: re-running the workflow refreshes the assets of a draft
      # release instead of failing on the existing tag, and never touches a published release.
      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          commit: ${{ github.sha }}
          draft: true
          prerelease: false
          allowUpdates: true
          updateOnlyUnreleased: true
          artifacts: >-
            MangaJaNaiGUI-Setup-${{ github.event.inputs.version }}.exe,
            publish/MangaJaNaiGUI-full-package-${{ github.event.inputs.version }}.zip,
            manifest.json,
            publish/packs-v${{ github.event.inputs.version }}/component-*.7z,
            publish/packs-v${{ github.event.inputs.version }}/packs.json
          token: ${{ secrets.GITHUB_TOKEN }}

  # Linux leg. Runs in mpv-AnimeJaNai's old-baseline build image (Ubuntu 22.04: glibc 2.35, .NET 10
  # SDK, 7zz, dpkg-deb, patchelf), as VideoJaNai's does, so the artifacts run on every mainstream distro
  # from ~2022 on. The image is a the-database package: this repo needs read access to it (package
  # settings > Manage Actions access).
  deploy-linux:
    if: ${{ github.event.inputs.windows_only != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash   # the container's default is dash; steps use bash-isms
    permissions:
      contents: write
      packages: read
    container:
      image: ghcr.io/the-database/animejanai-linux-build:ubuntu2204
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      VER: ${{ github.event.inputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Publish package builder (host RID = linux-x64)
        run: dotnet publish BuildMangaJaNai/BuildMangaJaNai.csproj -c Release -o builder

      - name: Publish app (linux-x64, self-contained)
        run: dotnet publish MangaJaNaiConverterGui/MangaJaNaiConverterGui.csproj -c Release -r linux-x64 --self-contained -o app-publish

      # Avalonia's X11 backend P/Invokes libICE/libSM (session management) unconditionally, and minimal
      # or Wayland-first distros don't install them; bundle jammy's copies next to the app, where .NET
      # looks first.
      - name: Bundle libICE + libSM with the app
        run: |
          apt-get update -qq
          mkdir -p /tmp/x11libs && cd /tmp/x11libs && apt-get download libice6 libsm6
          for d in /tmp/x11libs/*.deb; do dpkg-deb -x "$d" /tmp/x11libs/root; done
          cd "$GITHUB_WORKSPACE"
          cp -L /tmp/x11libs/root/usr/lib/x86_64-linux-gnu/libICE.so.6                 /tmp/x11libs/root/usr/lib/x86_64-linux-gnu/libSM.so.6 app-publish/
          patchelf --set-rpath '$ORIGIN' app-publish/libSM.so.6

      # The tarball install's scripts and icon sit at the install root, so they ship in the core (and
      # its manifest) like the app's own files.
      - name: Add the install scripts
        run: |
          install -m755 installer/linux/install.sh installer/linux/uninstall.sh app-publish/
          cp logo.png app-publish/mangajanai-gui.png

      - name: Publish updater (linux-x64, single file)
        run: dotnet publish MangaJaNaiUpdater/MangaJaNaiUpdater.csproj -c Release -r linux-x64 -o updater-publish

      # As on Windows, plus MangaJaNaiGUI-v<ver>-linux-x64.tar.gz (the core) in place of the zip.
      - name: Assemble package (linux-x64)
        run: ./builder/BuildMangaJaNai "$VER" --target linux-x64 --app-dir app-publish --updater updater-publish/MangaJaNaiUpdater --packs --out publish

      - name: Build AppImage (TensorRT runtime and models baked in; the GPU's kernels fetched on demand)
        continue-on-error: true  # don't block the tarball release if AppImage tooling trips
        run: |
          full="appimage-tree/MangaJaNaiConverterGui-v$VER"
          mkdir -p "$full"
          cp -a "publish/MangaJaNaiConverterGui-v$VER/." "$full/"
          for pack in publish/packs-v$VER/component-trt-runtime-linux-x64.7z publish/packs-v$VER/component-models-*-linux-x64.7z; do
            "$full/7zz" x -snl -y -o"$full" "$pack"
          done
          chmod +x installer/linux/*.sh installer/linux/AppRun
          installer/linux/build-appimage.sh "$full" "$VER" .

      - name: Stage RID-suffixed manifest
        run: cp "publish/MangaJaNaiConverterGui-v$VER/manifest.json" manifest-linux-x64.json

      - name: Create / update GitHub release (Linux assets)
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          commit: ${{ github.sha }}
          draft: true
          allowUpdates: true
          # The Linux leg only adds its RID-suffixed assets to the release the Windows leg owns: never
          # change an existing release's draft state, name or notes.
          omitDraftDuringUpdate: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          artifacts: >-
            publish/MangaJaNaiGUI-v${{ github.event.inputs.version }}-linux-x64.tar.gz,
            *.AppImage,
            manifest-linux-x64.json,
            publish/packs-v${{ github.event.inputs.version }}/component-*-linux-x64.7z,
            publish/packs-v${{ github.event.inputs.version }}/packs-linux-x64.json
          token: ${{ secrets.GITHUB_TOKEN }}
